name: Elisp CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs_version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.4"
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v4

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@main
        with:
          load-paths: "lisp"
          target-files: "lisp/*.el"

      - name: Run ERT Tests
        uses: tychoish/elisp-ci@main
        with:
          load-paths: "lisp test"
          test-files: "test/*-test.el"
          dependencies: "ob-go ob-rust"

      - name: Measure Code Coverage
        uses: tychoish/elisp-ci/coverage@main
        with:
          load-paths: "lisp test"
          source-files: "lisp/*.el"
          test-files: "test/*-test.el"
          report-format: "lcov"
          output-file: "coverage/lcov.info"
          dependencies: "ob-go ob-rust"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
